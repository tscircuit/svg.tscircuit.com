name: AM3352 live SVG benchmark
on:
  pull_request:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: NODE_ENV=production bun scripts/benchmark-am3352.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: am3352-benchmark
          path: /tmp/am3352-benchmark.json
