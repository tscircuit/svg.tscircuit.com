name: SVG3 Cloudflare
on:
  pull_request:
  push:
    branches: [main]

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: svg3
      - run: bun run check
        working-directory: svg3
      - run: bun run test
        working-directory: svg3
      - run: bun run test:runtime
        working-directory: svg3
      - run: bun run dry-run
        working-directory: svg3
      - name: Build the shared renderer container
        run: docker build -f svg3/Dockerfile -t svg3-renderer .
      - name: Check the production dependency set
        run: |
          docker image inspect svg3-renderer --format 'Renderer image size: {{.Size}} bytes'
          docker run --rm --entrypoint sh svg3-renderer -ec '
            test ! -d node_modules/next
            test ! -d node_modules/tscircuit
            test ! -d node_modules/@biomejs/biome
          '
      - name: Smoke test the container
        run: |
          docker run -d --name svg3-renderer -p 8080:8080 svg3-renderer
          cleanup() {
            smoke_exit=$?
            docker logs svg3-renderer > /tmp/svg3-container.log 2>&1
            cat /tmp/svg3-container.log
            if [ "$smoke_exit" -ne 0 ]; then
              smoke_details=$(tail -n 12 /tmp/svg3-smoke.log /tmp/svg3-container.log 2>/dev/null | tr '\n' ' ')
              smoke_details=${smoke_details//'%'/'%25'}
              printf '::error title=Renderer container smoke failed::%s\n' "$smoke_details"
            fi
            docker rm -f svg3-renderer
          }
          trap cleanup EXIT
          renderer_ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/health; then
              renderer_ready=true
              break
            fi
            test "$(docker inspect -f '{{.State.Running}}' svg3-renderer)" = true
            sleep 2
          done
          test "$renderer_ready" = true
          node svg3/smoke-container.mjs 2>&1 | tee /tmp/svg3-smoke.log
