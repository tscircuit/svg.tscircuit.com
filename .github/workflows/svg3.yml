name: SVG3 Cloudflare
on:
  pull_request:
  push:
    branches: [main]

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
        working-directory: svg3
      - name: Record resolved dependencies
        run: cat bun.lock
        working-directory: svg3
      - run: bun run check
        working-directory: svg3
      - run: bun run test
        working-directory: svg3
      - run: bun run dry-run
        working-directory: svg3
      - name: Build the shared renderer container
        run: docker build -f svg3/Dockerfile -t svg3-renderer .
      - name: Smoke test the container
        run: |
          docker run -d --name svg3-renderer -p 8080:8080 svg3-renderer
          trap 'docker logs svg3-renderer; docker rm -f svg3-renderer' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/health; then break; fi
            sleep 2
          done
          node svg3/smoke-container.mjs
